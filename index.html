<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metamor Resort</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; background: #fff; }
        .slider-wrapper { position: relative; width: 100%; height: 320px; overflow: hidden; }
        .gallery { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; height: 320px; scroll-behavior: smooth; }
        .gallery img { min-width: 100%; height: 320px; object-fit: cover; scroll-snap-align: start; image-rendering: -webkit-optimize-contrast; }
        .dots { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; gap: 8px; }
        .dot { height: 9px; width: 9px; background-color: rgba(255,255,255,0.6); border-radius: 50%; box-shadow: 0 0 3px rgba(0,0,0,0.3); }
        .dot.active { background-color: white; transform: scale(1.1); }
        
        .info-card { padding: 20px; }
        .title { font-size: 26px; font-weight: 800; margin-bottom: 5px; }
        .rating { color: #f39c12; font-size: 18px; margin-bottom: 15px; }
        .price { font-size: 22px; font-weight: bold; color: #1a1a1a; margin-bottom: 15px; }
        .details { color: #444; font-size: 16px; line-height: 1.5; }
        .btn-row { display: flex; gap: 12px; margin-top: 25px; }
        .btn { flex: 1; padding: 15px; border-radius: 8px; font-weight: bold; text-align: center; text-decoration: none; font-size: 16px; }
        .btn-primary { background: #007bff; color: white; }
        .btn-secondary { background: #f0f0f0; color: #333; }
    </style>
</head>
<body>

<div class="slider-wrapper">
    <div class="gallery" id="gallery">
        <img src="https://i.ibb.co/jjj10Gz7/57364.jpg" alt="Бассейн">
        <img src="https://i.ibb.co/jvKWSmVR/57365.jpg" alt="Вид ночью">
    </div>
    <div class="dots" id="dots">
        <span class="dot active"></span>
        <span class="dot"></span>
    </div>
</div>

<div class="info-card">
    <div class="title">Metamor Resort</div>
    <div class="rating">★★★★★ 4.9</div>
    <div class="price">от 20 000 драм</div>
    <div class="details">
        📍 Адрес: с. Фара, рядом с Егвардом.<br>
        ✅ Бассейн, банкетный зал, уютная беседка и мангал.
    </div>
    <div class="btn-row">
        <a href="tel:+37400000000" class="btn btn-primary">Позвонить</a>
        <a href="#" class="btn btn-secondary">Написать</a>
    </div>
</div>

<script>
    const gallery = document.getElementById('gallery');
    const dots = document.querySelectorAll('.dot');
    gallery.onscroll = () => {
        let index = Math.round(gallery.scrollLeft / gallery.offsetWidth);
        dots.forEach((dot, i) => dot.classList.toggle('active', i === index));
    };
</script>
</body>
</html>
