<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metamor Resort</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            color: #333;
        }
        .container {
            max-width: 500px;
            margin: 20px auto;
            padding: 0 10px;
        }
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            overflow: hidden;
            margin-bottom: 20px;
        }
        /* Блок галереи с прокруткой */
        .slider {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none; /* Скрыть скроллбар в Firefox */
        }
        .slider::-webkit-scrollbar {
            display: none; /* Скрыть скроллбар в Chrome/Safari */
        }
        .slider img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            flex-shrink: 0;
            scroll-snap-align: start;
        }
        /* Инфо блок */
        .info {
            padding: 20px;
        }
        .title {
            font-size: 1.2em;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 8px;
        }
        .price {
            font-size: 1.1em;
            color: #e74c3c;
            font-weight: bold;
            margin-bottom: 12px;
        }
        .desc {
            font-size: 0.95em;
            line-height: 1.5;
            color: #555;
            margin: 0;
        }
        .swipe-hint {
            text-align: center;
            font-size: 0.8em;
            color: #888;
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div style="background-color: #2c3e50; color: white; padding: 15px; text-align: center; font-weight: bold; font-size: 1.2em;">
    METAMOR RESORT
</div>

<div class="container">
    <div class="card">
        <!-- Галерея фото (можно листать пальцем вбок) -->
        <div class="slider">
            <img src="https://i.ibb.co/hRRv0tB6/57366.jpg" alt="Фото 1">
            <img src="https://images.unsplash.com/photo-1561501878-aabd62634533?q=80&w=800&auto=format&fit=crop" alt="Фото 2">
            <img src="https://images.unsplash.com/photo-1611892440504-42a792e24d32?q=80&w=800&auto=format&fit=crop" alt="Фото 3">
        </div>
        <div class="swipe-hint">← Листайте фото вправо/влево →</div>

        <!-- Информация снизу -->
        <div class="info">
            <div class="title">Зона отдыха с бассейном и банкетным залом</div>
            <div class="price">Договорная цена</div>
            <p class="desc">
                Идеальное место для вашего отдыха. Просторная территория с бассейном, уютные беседки, мангал и большой банкетный зал для мероприятий. Ждем вас в гости!
            </p>
        </div>
    </div>
</div>

</body>
</html>
