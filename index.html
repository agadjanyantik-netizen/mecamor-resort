<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metamor Resort - Зона отдыха</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            color: #333;
        }
        .catalog-container {
            max-width: 400px;
            margin: 20px auto;
            padding: 0 10px;
        }
        .ad-card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            overflow: hidden;
            margin-bottom: 20px;
        }
        .card-image-container {
            position: relative;
            width: 100%;
            height: 250px;
        }
        .card-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .label-discount {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: #f1c40f;
            color: #333;
            padding: 5px 10px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.9em;
        }
        .label-price {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background-color: rgba(0,0,0,0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-weight: bold;
        }
        .button-favorite {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            color: white;
            font-size: 1.5em;
            cursor: pointer;
        }
        .card-info {
            padding: 15px;
        }
        .card-info p {
            margin: 0 0 10px 0;
            line-height: 1.4;
            font-size: 1em;
        }
        .card-title {
            font-weight: bold;
            font-size: 1.1em;
            color: #2c3e50;
        }
        @media (min-width: 600px) {
            .catalog-container { max-width: 600px; }
        }
    </style>
</head>
<body>

<div style="background-color: #2c3e50; color: white; padding: 15px; text-align: center; font-weight: bold; font-size: 1.2em;">
    METAMOR RESORT
</div>

<div class="catalog-container">

    <!-- Карточка 1 -->
    <div class="ad-card">
        <div class="card-image-container">
            <!-- Сюда можно поставить прямую ссылку на фото с бассейном -->
            <img src="https://i.ibb.co/jjj10Gz7/57364.jpg" alt="Зона отдыха с бассейном">
            <div class="label-discount">Хит сезона</div>
            <div class="label-price">20000 др.</div>
            <button class="button-favorite">❤️</button>
        </div>
        <div class="card-info">
            <p>
                <span class="card-title">Зона отдыха с бассейном и беседкой</span><br>
                Идеальное место для отдыха с друзьями и близкими. Бассейн, чистая территория и отличная атмосфера!
            </p>
        </div>
    </div>

    <!-- Карточка 2 -->
    <div class="ad-card">
        <div class="card-image-container">
            <!-- Сюда ссылку на второе фото -->
            <img src="https://i.ibb.co/hRRv0tB6/57366.jpg" alt="Банкетный зал">
            <div class="label-discount">Банкет</div>
            <div class="label-price">Комфорт</div>
            <button class="button-favorite">❤️</button>
        </div>
        <div class="card-info">
            <p>
                <span class="card-title">Большой банкетный зал</span><br>
                Просторное помещение со столами и всеми удобствами для проведения мероприятий.
            </p>
        </div>
    </div>

</div>

</body>
</html>
