<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metamor Resort</title>
    <style>
        body { font-family: sans-serif; margin: 0; background-color: #fff; }
        /* Галерея сверху */
        .gallery { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; height: 300px; }
        .gallery img { min-width: 100%; height: 300px; object-fit: cover; scroll-snap-align: start; }
        /* Блок информации */
        .info-card { padding: 20px; }
        .title { font-size: 24px; font-weight: bold; margin-bottom: 5px; }
        .rating { color: #f39c12; font-weight: bold; margin-bottom: 15px; }
        .price { font-size: 22px; font-weight: bold; margin: 15px 0; color: #2c3e50; }
        .details { color: #555; line-height: 1.6; margin-bottom: 20px; }
        /* Кнопки */
        .btn-row { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; }
        .btn-primary { background: #007bff; color: white; }
        .btn-secondary { background: #e9ecef; color: #333; }
    </style>
</head>
<body>

    <!-- Сверху галерея фото -->
    <div class="gallery">
        <img src="https://i.ibb.co/hRRv0tB6/57366.jpg" alt="Фото 1">
        <img src="https://i.ibb.co/jjj10Gz7/57364.jpg" alt="Фото 2">
        <img src="https://i.ibb.co/jvKWSmVR/57365.jpg" alt="Фото 3">
    </div>

    <!-- Инфо блок -->
    <div class="info-card">
        <div class="title">Metamor Resort</div>
        <div class="rating">★★★★★ 4.9 (Отлично)</div>
        
        <div class="price">от 20 000 драм</div>
        
        <div class="details">
            <p>📍 Адрес: с. Фара, рядом с Егвардом.</p>
            <p>✅ Бассейн, банкетный зал, уютная беседка и мангал.</p>
            <p>☎️ Звоните для бронирования.</p>
        </div>

        <div class="btn-row">
            <a href="tel:+37400000000" class="btn btn-primary">Позвонить</a>
            <a href="#" class="btn btn-secondary">Написать</a>
        </div>
    </div>

</body>
</html>
