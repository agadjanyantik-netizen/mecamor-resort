<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metamor Resort</title>
    <style>
        body { font-family: sans-serif; margin: 0; background: #fff; }
        
        /* Блок галереи */
        .gallery { 
            display: flex; 
            overflow-x: auto; 
            scroll-snap-type: x mandatory; 
            width: 100%;
        }
        
        /* Картинки без искажений */
        .gallery img { 
            width: 100%; 
            flex-shrink: 0; 
            scroll-snap-align: start; 
            display: block; 
            height: auto; /* Автоматическая высота сохранит пропорции */
        }

        .card { padding: 20px; }
        .title { font-size: 24px; font-weight: bold; }
    </style>
</head>
<body>

<div class="gallery">
    <!-- Используем прямые ссылки на оригиналы -->
    <img src="https://i.ibb.co/jjj10Gz7/57364.jpg" alt="Photo 1">
    <img src="https://i.ibb.co/jvKWSmVR/57365.jpg" alt="Photo 2">
    <img src="https://i.ibb.co/5c317G88/57366.jpg" alt="Photo 3">
</div>

<div class="card">
    <div class="title">Metamor Resort</div>
    <p>Добро пожаловать в Metamor Resort!</p>
</div>

</body>
</html>
